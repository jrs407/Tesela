<header>
  <nav aria-label="Principal">
    @for (tab of tabs; track tab.path) {
      <a [routerLink]="tab.path" routerLinkActive="active">{{ tab.label }}</a>
    }
  </nav>
  <div class="sesion">
    <span>{{ usuario()?.nombre }}</span>
    <button type="button" (click)="salir()">Salir</button>
  </div>
</header>

<main>
  <router-outlet />
</main>
