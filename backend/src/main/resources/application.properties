spring.application.name=tesela-backend

# Conexion a Mongo. Con docker-compose.dev.yml el replica set exige directConnection=true desde fuera de Docker.
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/tesela?directConnection=true}
# Crea los indices declarados con @Indexed (por defecto Spring Boot no lo hace).
spring.data.mongodb.auto-index-creation=true

# Origenes permitidos por CORS (separados por comas). En produccion: URL publica del frontend.
tesela.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
