services:
  mongo:
    image: mongo:7
    container_name: tesela-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: tesela-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/tesela
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: tesela-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4200:4000"

volumes:
  mongo-data:
