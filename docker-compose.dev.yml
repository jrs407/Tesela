# Solo la base de datos: backend y frontend se ejecutan en local
# (mvnw spring-boot:run / ng serve).
# Desde fuera de Docker, conecta con directConnection=true (el replica set se anuncia como "mongo:27017"):
#   SPRING_MONGODB_URI=mongodb://localhost:27017/tesela?directConnection=true
services:
  mongo:
    image: mongo:7
    container_name: tesela-mongo-dev
    command: ["--replSet", "${MONGO_REPLICA_SET:-rs0}", "--bind_ip_all"]
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data-dev:/data/db
      - ./mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status() } catch (e) { rs.initiate({ _id: '${MONGO_REPLICA_SET:-rs0}', members: [{ _id: 0, host: 'mongo:27017' }] }) };
          quit(db.hello().isWritablePrimary ? 0 : 1)
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

volumes:
  mongo-data-dev:
